name: hacim-bot

# Bot her çalışmada ~9 dakika açık kalır. Açıldıktan kısa süre sonra bir sonraki çalışmayı
# kendisi sıraya koyar; yeni çalışma bu bitince hemen başlar, böylece bot kesintisiz çalışır.
# Zincir yine de koparsa hacim-bot-bekci iş akışı botu yeniden başlatır.
# Botu durdurmak için: önce hacim-bot-bekci, sonra hacim-bot → "..." → Disable workflow.

on:
  workflow_dispatch:

permissions:
  contents: write   # state.json'u kaydetmek için
  actions: write    # bir sonraki çalışmayı başlatmak için

concurrency:
  group: hacim-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04   # Python 3.12 hazır gelir
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Botu çalıştır (yaklaşık 9 dakika)
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SECONDS: "540"
          NEXT_RUN_WORKFLOW: hacim-bot.yml
          GH_TOKEN: ${{ github.token }}
        run: python3 bot.py

      - name: Ayarları kaydet
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "hacim-bot"
          git config user.email "hacim-bot@users.noreply.github.com"
          git add state.json
          git commit -q -m "state güncelle"
          for deneme in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            echo "Kaydetme denemesi $deneme başarısız, tekrar deneniyor..."
            sleep 5
          done
          exit 1

      # Bot sonraki çalışmayı normalde kendisi sıraya koyar; koyamadıysa burada tekrar denenir.
      # Bot hata ile biterse zincir durur (sonsuz hata döngüsü olmasın); bekçi iş akışı yeniden dener.
      - name: Sonraki çalışmayı başlat (gerekirse)
        if: ${{ !cancelled() && steps.bot.outcome == 'success' && hashFiles('.next_run_queued') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for deneme in 1 2 3 4 5; do
            gh workflow run hacim-bot.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            echo "Başlatma denemesi $deneme başarısız, tekrar deneniyor..."
            sleep 20
          done
          exit 1
