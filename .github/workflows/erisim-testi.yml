name: erisim-testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Futures veri kaynaklarini dene
        run: |
          for u in \
            "https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT" \
            "https://fapi1.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT" \
            "https://fapi2.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT" \
            "https://fapi3.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT" \
            "https://www.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT" \
            "https://www.binance.com/futures/data/takerlongshortRatio?symbol=BTCUSDT&period=5m&limit=1" \
            "https://api.coingecko.com/api/v3/derivatives/exchanges/binance_futures?include_tickers=unexpired" ; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -m 20 "$u")
            echo "SONUC $code $u"
            head -c 200 /tmp/body; echo; echo
          done
